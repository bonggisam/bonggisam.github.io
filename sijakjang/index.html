<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세이프랩노트">
<title>세이프랩노트 — 우리 학교 시약 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="themeFont" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* ---------- 공통 구조 ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);color:var(--bar-ink);border-bottom:var(--bar-line)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:var(--display-track);line-height:1;white-space:nowrap;flex:none}
#schoolName{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#who{white-space:nowrap;flex:none}
@media(max-width:430px){header.top{gap:8px;padding:10px 12px}.brand{font-size:19px}#who{display:none}}
.school{font-size:14px;opacity:.8}
.sp{flex:1}
main{max-width:1060px;margin:0 auto;padding:18px 16px 110px}
nav.tabs{position:fixed;z-index:6;display:flex;justify-content:center;background:var(--nav);border:var(--nav-border)}
nav.tabs button{background:none;border:0;cursor:pointer;color:var(--nav-ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;min-height:54px;min-width:58px;padding:8px 8px 10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--nav-on);font-weight:700}
.panel{background:var(--card);border:var(--card-border);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--card-shadow)}
h1.pt{font-family:var(--display);font-weight:var(--display-w);font-size:26px;letter-spacing:var(--display-track);line-height:1.2;margin:2px 2px 14px}
h2{font-family:var(--display);font-weight:var(--display-w);font-size:20px;letter-spacing:var(--display-track);margin:0 0 10px;line-height:1.3}
.lede{margin:0 0 12px;line-height:1.6}
.lede b{font-family:var(--display);font-size:1.15em;font-variant-numeric:tabular-nums}
table,.stat,.tile .tf{font-variant-numeric:tabular-nums}
h3{font-size:16px;margin:16px 0 8px}
.muted{color:var(--quiet);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:150px}
input,select,textarea{background:var(--field);border:var(--field-border);border-radius:var(--r-s);padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:88px}
label{display:block;font-size:13px;color:var(--quiet);margin:10px 0 4px}
.btn{border:var(--btn-border);background:var(--btn);color:var(--btn-ink);border-radius:var(--r-s);padding:10px 15px;min-height:46px;cursor:pointer;white-space:nowrap;font-weight:600}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri-edge)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:var(--btn-border);background:var(--btn);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;min-height:42px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri-edge)}
.search{font-size:19px;min-height:58px;border:var(--search-border)}
/* 저장군 색 */
.gA1,.gA2,.gA3{--gc:var(--cA)} .gB{--gc:var(--cB)} .gF{--gc:var(--cF)} .gO{--gc:var(--cO)} .gM{--gc:var(--cM)} .gT{--gc:var(--cT)} .gG{--gc:var(--cG)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 7px;border-radius:var(--r-chip);background:var(--gc);color:var(--chip-ink);vertical-align:middle}
/* 화학식 타일 — 앱의 시그니처 */
.tile{position:relative;flex:none;width:68px;height:68px;border-radius:var(--tile-r);background:var(--tile-bg);border:var(--tile-border);color:var(--tile-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.tile .tg{position:absolute;top:3px;left:5px;font-size:10px;font-weight:700;opacity:.85}
.tile .tf{font-family:var(--tile-font);font-weight:700;font-size:17px;line-height:1.1;text-align:center;padding:0 3px;word-break:break-all}
.tile .tn{font-size:10px;opacity:.85;margin-top:2px;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;gap:12px;align-items:center;padding:10px;border:var(--res-border);border-radius:var(--r);margin-top:8px;cursor:pointer;background:var(--card)}
.res:hover{background:var(--hover)}
.res .nm{font-weight:700}
.res>.grow{min-width:0}
.res>:last-child{flex:none}
@media(max-width:430px){.res{gap:10px;padding:10px 8px}.res .tile{width:60px;height:60px}.res .tile .tf{font-size:15px;margin-top:7px}.res .tile .tg{font-size:9px}.res .tile .tn{max-width:54px}.res .meter{width:64px}.res .btn.use{padding:5px 8px}}
.path{font-size:14px;color:var(--quiet)}
.path b{color:var(--ink)}
.meter{height:8px;width:78px;background:var(--track);border-radius:4px;overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.low{background:var(--bad)}
.note{padding:10px 12px;border-radius:var(--r-s);font-size:14px;margin:8px 0}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.info{background:var(--info-bg);color:var(--info)}
.ghs{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.ghs svg{width:30px;height:30px}
/* 시약장 그림 */
.cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.cab{border:var(--cab-border);border-radius:var(--cab-r);overflow:hidden;background:var(--cab-bg)}
.cab .hd{display:flex;gap:8px;align-items:center;padding:9px 11px;background:var(--cab-hd);color:var(--cab-hd-ink);font-weight:700;border-bottom:var(--cab-border)}
.cab .hd .code{font-family:var(--display);font-size:20px;line-height:1}
.cab .hd .room{margin-left:auto;font-weight:400;font-size:12px;opacity:.8}
.grid{display:grid}
.slot{border-right:var(--slot-line);border-bottom:var(--slot-line);min-height:74px;padding:6px;cursor:pointer;font-size:13px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;background:none;border-top:0;border-left:0;color:inherit}
.slot:hover{background:var(--hover)}
.slot .sn{color:var(--quiet);font-size:12px}
.slot .cnt{font-weight:700}
.slot .grp{font-size:11px;color:var(--quiet)}
.slot.hl{background:var(--hl-bg);outline:3px solid var(--hl);outline-offset:-3px}
.slot .out{font-size:11px;color:var(--warn);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:var(--slot-line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--quiet);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat .n{font-family:var(--display);font-size:34px;line-height:1.1;font-weight:var(--display-w)}
.stat .l{font-size:13px;color:var(--quiet)}
.dist{display:flex;height:22px;border-radius:var(--r-s);overflow:hidden;margin:10px 0 6px;border:var(--slot-line)}
.dist span{background:var(--gc);display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;background:var(--gc);margin-right:4px;vertical-align:-1px}
.alert{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:var(--slot-line);cursor:pointer}
.alert:last-child{border-bottom:0}
.k{font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--r-chip);flex:none;white-space:nowrap}
.k.ok{background:var(--ok-bg);color:var(--ok)}
.bcard{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:var(--card-border);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--card-shadow)}
.k.bad{background:var(--bad-bg);color:var(--bad)} .k.warn{background:var(--warn-bg);color:var(--warn)} .k.info{background:var(--info-bg);color:var(--info)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:var(--slot-line);margin:2px 3px 0 0;cursor:pointer}
.tag.have{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sugg{border:var(--field-border);border-radius:var(--r-s);margin-top:4px;max-height:230px;overflow:auto;background:var(--card)}
.sugg button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:var(--slot-line);background:none;cursor:pointer}
.sugg button:hover{background:var(--hover)}
.prog{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
.thumb{width:68px;height:68px;object-fit:cover;border-radius:var(--tile-r);flex:none}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);color:var(--ink);width:100%;max-width:580px;max-height:90vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:20px;border:var(--card-border)}
@media(min-width:720px){.modal-bg{align-items:center}.modal{border-radius:var(--r)}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:var(--r-s);z-index:30;font-size:14px}
th{white-space:nowrap}
table.sf th{vertical-align:top;white-space:normal;max-width:112px}table.sf td{vertical-align:top}
details summary{cursor:pointer;color:var(--link);font-size:14px}
a{color:var(--link)}
/* 라벨 미리보기 */
.label-card{border:2px solid #000;background:#fff;color:#000;padding:12px;border-radius:4px;display:grid;grid-template-columns:1fr auto;gap:8px;font-family:"Noto Sans KR",sans-serif}
.label-card .ln{font-size:20px;font-weight:800}
.label-card .ls{font-size:13px}
@media print{body *{visibility:hidden}.label-card,.label-card *{visibility:visible}.label-card{position:fixed;top:10mm;left:10mm;width:90mm}}
@media (prefers-reduced-motion:no-preference){.slot.hl{animation:pulse 1.2s ease-out 2}@keyframes pulse{0%{outline-offset:-3px}50%{outline-offset:-8px}100%{outline-offset:-3px}}}

.use{min-width:76px}
.bigbtn{width:100%;min-height:64px;font-size:19px;border-radius:14px}
.bigbtn{white-space:normal;line-height:1.25;padding-top:8px;padding-bottom:8px}
html:not([lang=ko]) body{word-break:normal;overflow-wrap:break-word}
html:not([lang=ko]) nav.tabs button{font-size:11.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
html:not([lang=ko]) .bigbtn{font-size:17px}
/* 과학실 배치도 */
.planwrap{margin:0 0 16px;max-width:720px}
.plan{position:relative;aspect-ratio:3/2;background-color:var(--field);border:var(--cab-border);border-radius:var(--r-s);overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100%/12) calc(100%/8)}
.pblk{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:6px;font-size:10px;line-height:1.1;overflow:hidden;text-align:center;padding:1px;user-select:none;-webkit-user-select:none}
.pblk small{font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pblk.cb{background:var(--card);border:2px solid var(--gc);color:var(--ink);cursor:pointer;z-index:1}
.pblk.cb b{font-family:var(--display);font-size:17px;line-height:1}
.pblk.fx{border:1px dashed var(--quiet);color:var(--quiet);background:transparent}
.plan.ed .pblk{touch-action:none;cursor:grab}
.pblk.sel{outline:3px solid var(--hl);outline-offset:1px;z-index:3}
.pblk.hl{background:var(--hl-bg);outline:3px solid var(--hl);outline-offset:-1px}
.flash .cab{outline:3px solid var(--hl);outline-offset:2px}
/* 저장군 주기율표 줄 · 워드마크 · 더보기 목록 */
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;max-width:640px}
@media(min-width:600px){.ptable{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}}
.ptable .tile{cursor:pointer;font:inherit;padding:0;width:auto;height:auto;aspect-ratio:1}
.ptable .tile .tf{font-size:22px}
.ptable .tile .tn{font-size:10px}
.ptable .tile .tn{max-width:92%}
.wordmark{display:flex;justify-content:center;gap:6px;margin:4px 0 16px}
.wordmark .tile{width:76px;height:76px}
.wordmark .tile .tf{font-size:28px}
.wordmark .tile .tn{font-size:11px;max-width:70px}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 20px;align-items:start}
.mgroup{margin-bottom:18px}
.mgroup h2{font-size:14px;font-family:var(--body);font-weight:700;color:var(--quiet);letter-spacing:0;margin:0 4px 6px}
.mlist{background:var(--card);border:var(--card-border);border-radius:var(--r);box-shadow:var(--card-shadow);overflow:hidden}
.mlist button{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;background:none;border:0;border-top:var(--slot-line);color:var(--ink);text-align:left;cursor:pointer}
.mlist button:first-child{border-top:0}
.mlist button:hover{background:var(--hover)}
.mi{flex:none;width:44px;height:44px;border-radius:var(--tile-r);background:var(--field);display:flex;align-items:center;justify-content:center;font-size:24px}
.mt{display:flex;flex-direction:column;min-width:0}
.mt b{font-size:16.5px}
.mt span{font-size:13.5px;color:var(--quiet)}
@media (prefers-reduced-motion:no-preference){.btn,.res,.tile,.mlist button,nav.tabs button{transition:transform .08s ease}.btn:active,.res:active,.ptable .tile:active,nav.tabs button:active{transform:scale(.97)}}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.more button{background:var(--card);color:var(--ink);border:var(--card-border);border-radius:16px;padding:18px 14px;text-align:left;cursor:pointer;box-shadow:var(--card-shadow);min-height:104px;display:flex;flex-direction:column;gap:6px}
.more button b{font-size:17px}
.more button span{font-size:13px;color:var(--quiet)}
.more button svg{width:26px;height:26px;color:var(--pri)}
.back{background:none;border:0;color:var(--link);cursor:pointer;padding:6px 0;margin-bottom:6px;font-size:15px}
.basket-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:var(--slot-line)}
.basket-item.got{opacity:.55}
.check{width:46px;height:46px;border-radius:12px;border:2px solid var(--pri);background:none;cursor:pointer;flex:none;font-size:22px;color:var(--pri-ink)}
.check[aria-pressed=true]{background:var(--pri)}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.steps i.on{background:var(--pri)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:var(--btn-border);background:var(--btn);font-size:20px;cursor:pointer}
.stepper b{min-width:22px;text-align:center}
/* ---------- 디자인 모드 (값은 THEMES에서) ---------- */
body{background-image:var(--bg-img,none);background-size:var(--bg-size,auto)}
nav.tabs{left:0;right:0;bottom:0}
body.nav-float nav.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:14px;border-radius:999px;padding:0 10px;box-shadow:0 6px 20px rgba(20,40,55,.25)}
@media(max-width:520px){body.nav-float nav.tabs{left:8px;right:8px;transform:none}nav.tabs button{min-width:0;flex:1}}
nav.tabs .em{font-size:22px;line-height:1;filter:var(--em-filter,none)}
nav.tabs button[aria-current=page] .em{filter:none;transform:scale(1.12)}
.tile{width:72px;height:72px}
body.tile-fill .tile{background:var(--gc);color:var(--tile-ink);border:0}
body.tile-line .tile{background:var(--card);border:2px solid var(--gc);color:var(--gc)}
body.tile-line .tile .tn{color:var(--quiet)}
body.tile-dark .tile{background:var(--tile-bg);color:var(--tile-ink);box-shadow:inset 0 6px 0 var(--gc)}
body.tile-dark .tile .tg{top:8px}
body.tile-glow .tile{background:var(--card);color:var(--ink);border:1.5px solid var(--gc);box-shadow:0 0 12px -2px var(--gc),inset 0 0 10px -4px var(--gc)}
body.tile-dot .tile{background:var(--card);border:1px solid var(--line);color:var(--ink)}
body.tile-dot .tile::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--gc)}
.tile .tf{font-size:19px}
.stat{background:var(--field);border-radius:var(--r-s);padding:10px 12px}
header.top{border-image:var(--bar-grad,none) 1}
.brand .em{margin-right:4px}
/* 디자인 고르기 */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th-card{border-radius:12px;padding:10px;cursor:pointer;text-align:left;border:2px solid transparent;min-height:118px}
.th-card[aria-pressed=true]{outline:3px solid var(--focus);outline-offset:2px}
.th-card .nm{font-size:15px;font-weight:700;margin-top:6px;display:block}
.th-card .sw{display:flex;gap:4px;margin-top:6px}
.th-card .sw i{width:16px;height:16px;border-radius:4px;display:block}
.lock-screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--card);border-radius:var(--r);padding:24px;max-width:380px;width:100%;box-shadow:var(--card-shadow);border:var(--card-border)}
.lock-box .big{font-size:44px;text-align:center}
</style>

<script>
'use strict';
/* ===== 디자인 10종 ===== */
const BASEV={'--display-w':'800','--display-track':'0','--focus':'#f08c2e','--bar-line':'0','--nav-border':'0','--card-border':'0','--pri-edge':'var(--pri)','--line':'#e3e8ec',
 '--ok':'#16794a','--ok-bg':'#ddf2e6','--warn':'#94570a','--warn-bg':'#fcefd9','--bad':'#b3261e','--bad-bg':'#fbe3e1','--chip-ink':'#1d2a33','--tile-ink':'#1d2a33','--tile-bg':'#1d2a33'};
const gf=(...f)=>'https://fonts.googleapis.com/css2?'+f.map(x=>'family='+x).join('&')+'&display=swap';
const THEMES=[
{id:'table',name:'주기율표',desc:'파스텔 원소 타일, 떠 있는 메뉴',font:gf('Gothic+A1:wght@400;600;800'),nav:'float',tile:'fill',

'싸이오사이안산 칼륨':['경고','H302 H312 H332 H412','산과 섞이거나 가열하면 매우 유독한 기체가 나옵니다. 평형 이동 실험에서는 묽은 용액만 쓰고 진한 산과 섞지 않습니다.','산·산화제와 분리, 밀봉합니다.','inorg'],
'싸이오황산 나트륨':['','','위험성이 낮지만 산과 반응하면 이산화 황(자극성 기체)과 황 침전이 생깁니다. 반응 속도 실험은 창을 열고, 천식이 있는 학생은 멀리 앉게 합니다.','산과 분리, 밀봉합니다.','inorg'],
'아세트산 나트륨':['','','위험성이 낮습니다. 과포화 용액(손난로) 실험에서 뜨거운 용액에 데지 않게 합니다.','밀봉합니다.','inorg'],
'마그네슘':['위험','H228 H261','연소할 때 나오는 흰 빛을 똑바로 보지 않습니다(눈 손상). 불이 붙은 마그네슘에는 물·이산화 탄소 소화기를 쓰지 않고 마른 모래로 덮습니다. 리본은 짧게 잘라 도가니 집게로 잡습니다.','습기를 피해 밀봉. 산·산화제·아이오딘과 분리합니다. 가루는 리본보다 훨씬 위험합니다.','solid'],
'아연':['경고','H410','알갱이는 비교적 안전하지만 가루는 불이 붙을 수 있고 습기와 반응합니다. 산과 반응하면 나오는 수소는 화기에서 멀리합니다.','습기를 피해 밀봉. 산·염기·산화제·황과 분리합니다.','metal'],
'철 가루':['경고','H228','고운 가루는 불꽃에 날리면 불이 붙습니다. 가루를 날리지 않고, 손난로 실험 후 내용물은 식힌 뒤 버립니다.','습기를 피해 밀봉. 산·산화제와 분리합니다.','solid'],
'구리':['','','판·선은 위험성이 낮습니다. 가열한 구리는 색이 변하지 않아도 뜨거우니 식을 때까지 만지지 않습니다.','산·산화제와 분리합니다.','solid'],
'산화 구리(II)':['경고','H410','검은 가루를 들이마시거나 삼키지 않게 합니다. 환원 실험 뒤 시험관이 매우 뜨겁습니다.','밀봉. 금속 가루(알루미늄·마그네슘)와 분리합니다.','metal'],
'활성탄':['','','가루가 날리면 호흡기에 자극을 주고 주변을 오염시킵니다. 젖은 활성탄은 밀폐 공간의 산소를 줄일 수 있습니다.','밀봉. 산화제(질산 칼륨·과망가니즈산 칼륨)와 분리합니다.','solid'],
'에탄올':['위험','H225 H319','증기에 불이 쉽게 붙습니다. 알코올램프는 불을 끄고 식힌 뒤에 채우고, 램프끼리 불을 옮겨 붙이지 않습니다. 에탄올을 데울 때는 불꽃이 아닌 물중탕을 씁니다.','인화성 시약 칸, 화기·열원에서 먼 곳. 산화제(질산·과망가니즈산 칼륨·다이크로뮴산 칼륨)와 분리합니다.','org'],
'아세톤':['위험','H225 H319 H336','휘발이 빨라 증기가 금방 퍼지고 불이 쉽게 붙습니다. 화기를 모두 끄고 환기하며 씁니다. 오래 맡으면 어지럽습니다.','인화성 시약 칸. 산화제·질산·과산화 수소와 분리합니다.','org'],
'헥세인':['위험','H225 H304 H315 H336 H361 H373 H411','인화성이 크고, 오래 들이마시면 말초 신경에 손상을 줍니다. 삼켜서 기도로 넘어가면 치명적일 수 있으니 토하게 하지 않습니다. 환기장치에서 쓰고, 가능하면 헵테인으로 바꿉니다.','인화성 시약 칸. 산화제와 분리합니다.','org'],
'페놀프탈레인':['위험','H341 H350 H361','가루는 발암성·생식 독성 우려 물질입니다. 가루를 다는 일은 교사가 장갑을 끼고 하며, 학생에게는 묽은 지시약 용액만 줍니다. 지시약 용액은 에탄올이 들어 있어 인화성입니다.','밀봉. 지시약 용액은 인화성 시약 칸에 둡니다.','org'],
'BTB':['','','위험성이 낮습니다. 용액에 에탄올이 들어 있으면 화기에 주의합니다.','밀봉, 빛을 피합니다.','org'],
'메틸 오렌지':['위험','H301','가루는 삼키면 유독합니다. 가루는 교사가 다루고 학생에게는 묽은 지시약 용액만 줍니다.','밀봉합니다.','org'],
'메틸렌 블루':['경고','H302','삼키면 유해합니다. 피부·옷에 짙은 파란 얼룩이 오래 남으니 장갑을 낍니다.','밀봉, 빛을 피합니다.','org'],
'수단 III':['','','분류 정보가 제한적인 색소입니다. 피부·옷에 붉은 얼룩이 남으니 장갑을 끼고, 가루를 들이마시지 않습니다. 용액은 에탄올 때문에 인화성입니다.','밀봉. 용액은 인화성 시약 칸에 둡니다.','org'],
'녹말':['','','위험성이 낮습니다. 고운 가루를 불꽃 근처에서 날리지 않습니다(분진 연소).','밀봉해 습기를 피합니다.','org'],
'포도당':['','','위험성이 낮습니다. 실험용은 먹지 않습니다.','밀봉합니다. 산화제와 분리합니다.','org'],
'설탕':['','','위험성이 낮습니다. 실험용은 먹지 않습니다. 진한 황산과의 탈수 반응은 교사가 환기장치에서 시연합니다.','밀봉합니다. 산화제와 분리합니다.','org'],
'스테아르산':['','','위험성이 낮습니다. 녹인 스테아르산에 데지 않게 하고, 직접 불로 가열하지 않습니다.','밀봉합니다.','org'],
'질산 납(II)':['위험','H272 H302 H332 H318 H360 H373 H410','납 화합물은 생식 독성이 있고 몸에 쌓입니다. 학교에서는 쓰지 않는 것이 좋고(앙금 생성은 염화 칼슘 + 탄산 나트륨으로 대체), 꼭 필요하면 교사 시연으로만 합니다. 임신 중이거나 가능성이 있으면 다루지 않습니다.','독성 시약 칸에 잠금 보관합니다. 유기물·금속 가루와 분리합니다.','metal']};
const safeOf=n=>{const s=SAFE[n];return s?{sig:s[0],h:s[1]?s[1].split(' '):[],use:s[2],keep:s[3],waste:s[4]}:null};
function ppeOf(s){const h=s.h,has=(...c)=>c.some(x=>h.includes(x));const p=[];
  if(has('H314','H318'))p.push('보안경(고글)','내화학 장갑','실험복');else if(h.length)p.push('보안경','실험용 장갑','실험복');else p.push('보안경','실험복');
  if(has('H330','H331','H332','H334','H335','H336','H340','H350','H351','H360'))p.push('환기장치(흄후드) 또는 충분한 환기');
  if(has('H225','H226','H228'))p.push('주변 화기 제거');return p}
function aidOf(s){const h=s.h,has=(...c)=>c.some(x=>h.includes(x));const a=[];
  a.push('<b>눈</b> 흐르는 물이나 눈 세척기로 15분 이상 씻고'+(has('H314','H318')?' 바로':'')+' 병원에 갑니다. 콘택트렌즈는 뺍니다.');
  a.push('<b>피부</b> 오염된 옷을 벗고 다량의 흐르는 물로 씻습니다. 산·염기도 중화하려 하지 말고 물로만 씻습니다.');
  a.push('<b>흡입</b> 신선한 공기가 있는 곳으로 옮깁니다. 호흡이 어렵거나 의식이 흐리면 119.');
  a.push('<b>삼킴</b> 뱉고 입을 여러 번 헹굽니다. 억지로 토하게 하지 않습니다'+(has('H304')?'(기도로 넘어가면 치명적)':'')+'. '+(has('H300','H301','H302','H304','H310','H314')?'즉시 119에 연락합니다.':'이상이 있으면 병원에 갑니다.'));
  return a}
function safetyHTML(name,cas){const s=safeOf(name);
  const link='<p class="muted">출처·한계: 원액·고체 기준으로 간추린 참고 자료입니다. 농도·제품에 따라 분류가 달라집니다. 실험 전에는 납품업체가 준 MSDS나 <a href="https://msds.kosha.or.kr" target="_blank" rel="noopener">안전보건공단 MSDS</a>(CAS '+esc(cas||'')+')의 4번 응급조치·6번 누출 대처·10번 안정성 및 반응성을 확인하세요.</p>';
  if(!s)return '<p class="muted">이 시약의 안전 요약은 아직 없습니다.</p>'+link;
  return '<table class="sf">'+
  '<tr><th>신호어</th><td>'+(s.sig?'<b style="color:var(--'+(s.sig==='위험'?'bad':'warn')+')">'+s.sig+'</b>':'해당 없음 (GHS 분류 대상 아님)')+'</td></tr>'+
  (s.h.length?'<tr><th>유해·위험</th><td>'+s.h.map(c=>'<div>'+c+' '+esc(HTXT[c]||'')+'</div>').join('')+'</td></tr>':'')+
  '<tr><th>보호구</th><td>'+ppeOf(s).join(' · ')+'</td></tr>'+
  '<tr><th>취급</th><td>'+esc(s.use)+'</td></tr>'+
  '<tr><th>보관</th><td>'+esc(s.keep)+'</td></tr>'+
  '<tr><th>응급조치</th><td>'+aidOf(s).map(x=>'<div style="margin-bottom:4px">'+x+'</div>').join('')+'</td></tr>'+
  '<tr><th>폐기</th><td>'+WASTEDOC[s.waste]+'. 하수구에 버리지 않습니다.</td></tr></table>'+link}
function safetyModal(name){const m=findMaster(name);if(!m)return;
  modal('<h2 style="margin:0">'+esc(m.name)+'</h2><div class="muted">'+esc(m.eng)+' · '+esc(m.formula)+(m.cas?' · CAS '+esc(m.cas):'')+' · '+chip(m.group)+' '+esc(GROUPS[baseGroup(m.group)]||'')+'</div>'+
  (ghsOf(m.name).length?'<div class="row" style="margin:6px 0">'+ghsHTML(m.name)+'<span class="muted">'+ghsOf(m.name).map(c=>GHSN[c]).join(', ')+'</span></div>':'')+
  safetyHTML(m.name,m.cas)+'<button class="btn pri bigbtn" id="sX">닫기</button>');document.getElementById('sX').onclick=closeModal}

/* 교육부·한국과학창의재단 「과학실험 안전 매뉴얼」(2021) 화학약품 관련 내용 요약 */
const GUIDE=[
['살 때와 대장','필요한 최소량만 삽니다. 살 때는 필요량 파악 → 약품 대장 확인 → 모자란 만큼만 구매(납품업체에 MSDS 요청) → 검수하고 MSDS 비치 → 대장 등재 → 실험 뒤 남은 양을 확인해 대장을 고치는 순서로 합니다.|보유 현황은 1년에 한 번 이상 확인하고 유효기간이 지난 약품은 폐기합니다.|용기에는 약품 이름, 제조일·제조사, 구입일, 개봉일을 적은 라벨을 붙이고, 뚜껑과 라벨 상태를 주기적으로 살핍니다.'],
['보관 원칙','약품은 가나다순이 아니라 성질별로 나누어 보관합니다. 나누는 까닭은 서로 반응하는 물질을 떼어 놓기 위해서입니다.|무기 화합물과 유기 화합물을 나눕니다(산화제가 유기물과 떨어집니다).|아세트산을 뺀 무기산은 금속·염기와 나눕니다. 아세트산은 무기산이 아니라 유기 화합물 쪽에 둡니다.|인화성 액체는 무기 화합물과 다른 칸에 둡니다.|과망가니즈산 칼륨, 염소산 칼륨, 질산 칼륨처럼 탄소·황·유기물과 섞이면 위험한 약품은 각각 따로 둡니다.|실험대나 바닥 등 시약장 밖에 약품을 두지 않고, 옮길 때는 시약 바구니를 씁니다.'],
['시약장','시약장은 화기·열원·직사광선·습기에서 멀고 통로가 아닌 곳에 두며, 이중 잠금으로 학생 접근을 막습니다. 문 앞에 약품 목록표를 붙입니다.|소금·황산 구리 같은 염류, 포도당·녹말처럼 냄새나 증기가 없는 약품은 일반 시약장에, 위험하거나 증기가 나는 약품은 배기형·밀폐형 시약장에 둡니다.|실외 배기형(덕트형)은 모터 수명이 5~7년, 실내 배기형(필터형)은 필터 수명이 1~1.5년쯤이므로 가동 상태를 점검하고 제때 바꿉니다.|위험한 약품은 높은 칸에 두지 않습니다.'],
['MSDS와 GHS','MSDS(물질안전보건자료)는 16개 항목으로 되어 있습니다. 실험 전에는 4번 응급조치, 6번 누출 사고 시 대처, 10번 안정성 및 반응성을 꼭 봅니다.|법적으로 유효한 MSDS는 약품을 납품한 업체가 준 자료입니다. 구입할 때 받아서 취급하는 사람이 쉽게 볼 수 있는 곳에 비치·게시합니다.|안전보건공단 누리집 자료는 실험 전 확인과 교육용으로 씁니다.|GHS 그림문자는 9가지입니다(폭발성·인화성·산화성·고압가스·부식성·급성 독성·유해·건강 유해·수생 환경).'],
['쏟았을 때','위험한 정도는 약품의 성질과 쏟은 양으로 판단합니다. 위험하면 모두 대피시키고 119에 도움을 청하며, 교사는 자신의 안전이 확보되는 범위에서만 보호구를 쓰고 직접 처리합니다.|대피할 때 복도 쪽 문과 창은 닫고 바깥쪽 창은 모두 엽니다.|강산(염산·황산·질산)은 탄산 나트륨이나 탄산수소 나트륨 가루를 뿌려 중화합니다. 열과 기체가 나오므로 반응이 끝날 때까지 물러나 있습니다.|염기성 용액은 시트르산(구연산)으로 중화합니다. 중화한 뒤 pH 시험지로 확인하고 치웁니다.|에탄올·헥세인·아세톤은 양이 적으면 종이 티슈로 닦아 밀봉하고 환기합니다. 많으면 모두 대피합니다.|아이오딘은 적은 양이면 물 적신 티슈로 닦고, 산화제 가루는 날리지 않게 쓸어 담아 밀봉합니다.'],
['몸에 닿았을 때','눈: 눈 세척기나 흐르는 물로 15분 이상 씻습니다. 렌즈는 빼고, 다친 눈이 아래로 가게 기울여 눈머리에서 눈꼬리 쪽으로 물을 흘립니다. 씻은 뒤 반드시 병원에 갑니다.|피부: 다량의 흐르는 물로 충분히 씻습니다. 넓게 묻었으면 비상 샤워기로 옷을 입은 채 씻으며 벗습니다. 산이나 염기도 물로만 씻습니다.|흡입: 실험실의 모든 사람을 내보내고 신선한 공기가 있는 곳으로 옮깁니다. 의식을 잃거나 숨쉬기 어려우면 119에 신고합니다.|삼킴: 바로 뱉고 여러 번 헹굽니다. 삼켰다면 즉시 119에 연락하고 임의로 토하게 하지 않습니다.|병원에 갈 때는 해당 약품의 MSDS(또는 용기)를 함께 보냅니다. 처치하는 교사도 장갑과 보안경을 씁니다.'],
['폐수와 폐시약','시약이 녹아 있거나 섞인 물은 양이 적어도 폐수입니다. 홈판에 남은 용액과 기구를 헹군 물(3회)까지 모읍니다.|유기계, 산, 알칼리계, 무기계로 나누어 전용 용기에 모읍니다. 암모니아가 든 폐수는 유기계로, 아세트산은 무기산 폐수와 섞지 않습니다.|용기에는 눈에 띄게 경고 문구·내용물·주의사항·담당자 연락처를 적습니다. 깔때기를 쓰고 고형물은 걸러 냅니다.|중금속·강산·강염기 등 섞이면 위험한 것, 반응성·폭발성 물질은 수집 용기에 붓지 않고 따로 모아 전문 업체에 맡깁니다.|과학실이 아닌 준비실의 폐수 전용 보관함에 이중 잠금으로, 직사광선을 피해 통풍이 되는 곳에 둡니다.|폐시약은 용기째 성상별로 나누어 병이 부딪히지 않게 포장하고 상자에 목록을 붙입니다.|운반은 2인 이상이 보호구를 쓰고 손수레로 합니다. 위탁 처리 확인서는 3년간 보관하고, 폐수 관리대장을 쓰며 월 1회 이상 자체 점검표를 작성합니다.']];
let safeQ='';

  '<div id="sfList" style="margin-top:8px"></div></section>';

/* ===== 여러 병 한꺼번에 등록 =====
   사진을 여러 장 찍거나 고르면 차례로 글자를 읽어 목록을 만들고, 확인한 뒤 한 번에 등록한다.
   목록(BATCH)은 화면을 옮겨도 앱을 닫기 전까지 남는다. */
const WEB_URL='https://bonggisam.github.io/sijakjang/';
const LIQUIDS=['염산','황산','질산','아세트산','암모니아수','과산화 수소','에탄올','아세톤','헥세인'];
let BATCH=[],batchBusy=false;
function batchPos(group){const r=recommendSlots(group)[0];if(r)return r.cab.id+'|'+r.k;const c=S.cabinets[0];return c?c.id+'|'+Object.keys(c.slots)[0]:''}
function batchSetMaster(it,name){const m=findMaster(name);it.name=name;if(m){it.name=m.name;it.formula=m.formula;it.cas=m.cas;it.group=m.group;if(!it.sized)it.unit=LIQUIDS.includes(m.name)?'mL':'g';it.pos=batchPos(m.group)}return !!m}
function batchAdd(files){[...files].forEach(f=>{const it={id:uid(),file:f,st:'wait',name:'',formula:'',cas:'',group:'G',size:500,unit:'g',sized:false,maker:'',grade:'',expiry:'',photo:'',pos:batchPos('G')};
  BATCH.push(it);shrink(f,u=>{it.photo=u;batchCard(it)})});drawBatch();batchRun()}
async function batchRun(){if(batchBusy)return;batchBusy=true;
  for(;;){const it=BATCH.find(x=>x.st==='wait');if(!it)break;it.st='run';batchCard(it);
    try{const r=await readLabel(it.file,()=>{});const p=parseLabel(r.text||'',r.lines);
      if(p.size){it.size=p.size;it.unit=p.unit;it.sized=true}
      if(p.master)batchSetMaster(it,p.master);else{if(p.guess)it.name=p.guess;if(p.cas)it.cas=p.cas}
      if(p.maker)it.maker=p.maker;if(p.grade)it.grade=p.grade;if(p.expiry)it.expiry=p.expiry;
      it.st=p.master?'ok':'check'}catch(e){it.st='check'}
    it.file=null;batchCard(it)}
  batchBusy=false;batchSummary()}
function batchCardHTML(it){const m=findMaster(it.name);
  const stt={wait:['info','순서 기다리는 중'],run:['info','글자를 읽는 중…'],ok:['ok','읽음'],check:['warn',it.name?'이름 확인 필요':'이름을 넣어 주세요']}[it.st];
  const rec=new Set(recommendSlots(it.group).map(x=>x.cab.id+'|'+x.k));
  const opts=S.cabinets.map(c=>Object.keys(c.slots).map(k=>{const v=c.id+'|'+k;return '<option value="'+v+'" '+(v===it.pos?'selected':'')+'>'+(rec.has(v)?'★ ':'')+esc(slotLabel(c,k))+'</option>'}).join('')).join('');
  const busy=it.st==='wait'||it.st==='run';
  return '<div class="bcard" id="bc-'+it.id+'" data-id="'+it.id+'">'+(it.photo?'<img class="thumb" src="'+it.photo+'" alt="찍은 병 사진">':'<span class="thumb" style="display:inline-block;background:var(--field)"></span>')+
  '<div class="grow" style="min-width:0"><span class="k '+stt[0]+'">'+stt[1]+'</span>'+(m?'<div style="margin-top:6px">'+chip(m.group)+' <span class="muted">'+esc(m.formula)+' · '+esc(GROUPS[baseGroup(m.group)]||'')+'</span></div>':'<div class="muted" style="margin-top:6px">목록에 없는 시약은 일반(G)으로 등록됩니다</div>')+'</div>'+
  '<button class="btn sm" data-del="'+it.id+'" aria-label="목록에서 빼기">✕</button>'+
  '<div style="flex-basis:100%"><input data-f="name" list="mlist" value="'+esc(it.name)+'" placeholder="시약 이름" aria-label="시약 이름" '+(busy?'disabled':'')+'>'+
  '<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input data-f="size" type="number" inputmode="decimal" value="'+esc(it.size)+'" aria-label="용량" style="width:92px;flex:none" '+(busy?'disabled':'')+'><select data-f="unit" aria-label="단위" style="width:84px;flex:none" '+(busy?'disabled':'')+'>'+['mL','L','g','kg'].map(u=>'<option '+(u===it.unit?'selected':'')+'>'+u+'</option>').join('')+'</select><input data-f="maker" value="'+esc(it.maker)+'" placeholder="제조사" aria-label="제조사" style="min-width:0" '+(busy?'disabled':'')+'></div>'+
  '<select data-f="pos" aria-label="보관 위치" style="margin-top:6px" '+(busy?'disabled':'')+'>'+opts+'</select></div></div>'}
function batchBind(el){const it=BATCH.find(x=>x.id===el.dataset.id);if(!it)return;
  el.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>{const f=inp.dataset.f,v=inp.value;
    if(f==='name'){const hit=batchSetMaster(it,v.trim());if(it.st!=='wait'&&it.st!=='run')it.st=hit?'ok':'check';batchCard(it)}
    else if(f==='size'){it.size=+v||0;it.sized=true}else if(f==='unit'){it.unit=v;it.sized=true}else it[f]=v;batchSummary()});
  el.querySelector('[data-del]').onclick=()=>{BATCH=BATCH.filter(x=>x.id!==it.id);drawBatch()}}
function batchCard(it){if(tab!=='batch')return;const el=document.getElementById('bc-'+it.id);if(!el){drawBatch();return}
  const t=document.createElement('div');t.innerHTML=batchCardHTML(it);const n=t.firstChild;el.replaceWith(n);batchBind(n);batchSummary()}
function batchSummary(){const el=document.getElementById('bSum');if(!el)return;const run=BATCH.filter(x=>x.st==='wait'||x.st==='run').length,ready=BATCH.filter(x=>x.st!=='wait'&&x.st!=='run'&&x.name.trim()).length,need=BATCH.length-run-ready;
  el.innerHTML=BATCH.length?'<b>'+BATCH.length+'병</b> · 등록 준비 '+ready+(run?' · 읽는 중 '+run:'')+(need?' · <span style="color:var(--warn)">이름 필요 '+need+'</span>':''):'';
  const b=document.getElementById('bGo');if(b){b.disabled=!ready||!!run;b.textContent=run?'글자를 읽는 중…':ready?ready+'병 모두 등록':'모두 등록';b.style.opacity=b.disabled?.55:1}}
function drawBatch(){if(tab!=='batch')return;const box=document.getElementById('bList');if(!box)return;
  box.innerHTML=BATCH.length?BATCH.map(batchCardHTML).join(''):'<p class="muted" style="text-align:center;margin:18px 0">아직 찍은 사진이 없습니다.</p>';
  box.querySelectorAll('.bcard').forEach(batchBind);batchSummary()}
function vBatch(){
  if(!canEdit()){go('add');return}
  V().innerHTML='<button class="back" id="backAdd">‹ 등록</button><h1 class="pt">여러 병 한꺼번에 등록</h1>'+
  '<section class="panel"><p class="muted" style="margin-top:0">시약병 라벨을 한 병씩 이어서 찍거나, 미리 찍어 둔 사진을 여러 장 고르세요. 사진마다 글자를 읽어 목록을 만들고, 확인한 뒤 한 번에 등록합니다.</p>'+
  '<label class="btn pri bigbtn" style="margin:0;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer"><span aria-hidden="true">'+E('add')+'</span> 라벨 사진 찍기<input id="bShot" type="file" accept="image/*" capture="environment" style="display:none"></label>'+
  '<label class="btn" style="margin:8px 0 0;display:flex;justify-content:center;color:var(--btn-ink);cursor:pointer">앨범에서 여러 장 고르기<input id="bPick" type="file" accept="image/*" multiple style="display:none"></label>'+
  '<p class="muted" style="margin-bottom:0">★ 표시는 저장군에 맞는 추천 칸입니다. 목록에 없는 시약은 이름만 넣어도 등록되며, 자세한 정보는 나중에 병 화면에서 고칠 수 있습니다.</p></section>'+
  '<datalist id="mlist">'+M.map(m=>'<option value="'+esc(m.name)+'">').join('')+'</datalist>'+
  '<div id="bSum" class="muted" style="margin:0 4px 8px" role="status"></div><div id="bList"></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn pri grow bigbtn" id="bGo">모두 등록</button><button class="btn" id="bClear">목록 비우기</button></div>';
  const $=id=>document.getElementById(id);$('backAdd').onclick=()=>go('add');
  const on=e=>{const fs=e.target.files;if(fs&&fs.length)batchAdd(fs);e.target.value=''};$('bShot').onchange=on;$('bPick').onchange=on;
  $('bClear').onclick=()=>{if(!BATCH.length)return;modal('<h2>목록을 비울까요?</h2><p>찍은 사진 '+BATCH.length+'장이 목록에서 사라집니다. 이미 등록한 시약은 그대로입니다.</p><div class="row"><button class="btn bad grow" id="y">비우기</button><button class="btn" id="n">취소</button></div>');
    $('y').onclick=()=>{BATCH=BATCH.filter(x=>x.st==='run');closeModal();drawBatch()};$('n').onclick=closeModal};
  $('bGo').onclick=()=>{const items=BATCH.filter(x=>x.st!=='wait'&&x.st!=='run'&&x.name.trim());if(!items.length)return;
    const warn=[];items.forEach(it=>{const [cid,k]=it.pos.split('|');const cab=cabOf(cid);if(cab)slotWarnings(cab,k,it.group).forEach(w=>warn.push(it.name+' → '+slotLabel(cab,k)+': '+w))});
    const doIt=()=>{let n=0;items.forEach(it=>{const [cid,k]=it.pos.split('|');const cab=cabOf(cid);if(!cab||!cab.slots[k])return;const name=it.name.trim();
        S.bottles.push({id:uid(),name,formula:it.formula,cas:it.cas,group:it.group,size:+it.size||0,unit:it.unit,remain:1,cabId:cab.id,slot:k,maker:it.maker,grade:it.grade,opened:today(),expiry:it.expiry,memo:'',made:false,tags:[],photo:it.photo,out:null,hist:[{t:today(),who:S.me.name,what:'등록 → '+slotLabel(cab,k)}],mt:Date.now()});
        S.buy=S.buy.filter(x=>x.name!==name);it.done=true;n++});
      BATCH=BATCH.filter(x=>!x.done);logAct('여러 병 등록: '+n+'병');save();closeModal();toast(n+'병을 등록했습니다');if(BATCH.length)drawBatch();else go('cabinet')};
    if(warn.length){modal('<h2>보관 규칙 경고 '+warn.length+'건</h2><div style="max-height:40vh;overflow:auto">'+warn.slice(0,30).map(x=>'<div class="note bad">'+esc(x)+'</div>').join('')+'</div><p class="muted">목록에서 보관 위치를 바꾸는 것을 권장합니다.</p><div class="row"><button class="btn pri grow" id="back">위치 다시 고르기</button><button class="btn bad" id="force">그래도 등록</button></div>');
      $('back').onclick=closeModal;$('force').onclick=doIt}else doIt()};
  drawBatch()}

/* ===== 과학실 배치도: 시약장을 실제 놓인 자리대로 끌어다 놓는다 =====
   위치는 cab.pos={x,y,w,h}, 문·창문 같은 표시는 room.fix=[{id,t,x,y,w,h}] (칸 단위, 가로 12 × 세로 8) */
const PW=12,PH=8;
const FIX={board:['칠판','🖊️'],desk:['교탁','🧑‍🏫'],door:['문','🚪'],window:['창문','🪟'],bench:['실험대','🧪'],sink:['개수대','🚰'],hood:['환기장치','💨'],shower:['비상 샤워기','🚿'],ext:['소화기','🧯']};
let planEdit=null,planSel=null;
function planEnsure(room){const cs=S.cabinets.filter(c=>c.roomId===room.id);cs.forEach((c,i)=>{if(!c.pos)c.pos={x:(i%4)*3+.5,y:Math.floor(i/4)*3+.5,w:2,h:2}});if(!room.fix)room.fix=[];return cs}
const planSt=p=>'left:'+(p.x/PW*100)+'%;top:'+(p.y/PH*100)+'%;width:'+(p.w/PW*100)+'%;height:'+(p.h/PH*100)+'%';
function planHTML(room){const cs=planEnsure(room),ed=planEdit===room.id;
  const grp=c=>{const k=Object.keys(c.slots)[0];const a=k&&c.slots[k].allowed;return baseGroup((a&&a[0])||'G')};
  return '<div class="planwrap"><div class="plan'+(ed?' ed':'')+'" data-room="'+room.id+'" aria-label="'+esc(room.name)+' 배치도">'+
  room.fix.filter(f=>FIX[f.t]).map(f=>'<div class="pblk fx'+(ed&&planSel==='f:'+f.id?' sel':'')+'" data-k="f:'+f.id+'" style="'+planSt(f)+'"><span aria-hidden="true">'+FIX[f.t][1]+'</span><small>'+FIX[f.t][0]+'</small></div>').join('')+
  cs.map(c=>'<div class="pblk cb g'+grp(c)+(hl&&hl.cab===c.id?' hl':'')+(ed&&planSel==='c:'+c.id?' sel':'')+'" data-k="c:'+c.id+'" role="button" tabindex="0" style="'+planSt(c.pos)+'"><b>'+esc(c.code)+'</b><small>'+esc(c.name)+'</small></div>').join('')+'</div>'+
  (ed?'<p class="muted" style="margin:8px 0 6px">시약장을 끌어서 실제 자리에 놓으세요. 고른 것은 아래 버튼으로 돌리거나 크기를 바꿉니다.</p><div class="row" style="gap:6px"><button class="btn sm" data-pa="rot">돌리기</button><button class="btn sm" data-pa="wider">넓게</button><button class="btn sm" data-pa="narrower">좁게</button><button class="btn sm" data-pa="del">표시 지우기</button><span class="sp"></span><button class="btn sm pri" data-pa="done">배치 완료</button></div>'+
    '<div class="row" style="gap:6px;margin-top:8px"><span class="muted">표시 놓기</span>'+Object.keys(FIX).map(t=>'<button class="btn sm" data-fix="'+t+'"><span aria-hidden="true">'+FIX[t][1]+'</span> '+FIX[t][0]+'</button>').join('')+'</div>'
     :'<div class="row" style="margin-top:6px"><span class="muted grow">시약장을 누르면 아래 칸 그림으로 이동합니다.</span>'+(isAdmin()?'<button class="btn sm" data-planedit="'+room.id+'">배치 바꾸기</button>':'')+'</div>')+'</div>'}
function planBind(){
  document.querySelectorAll('[data-planedit]').forEach(b=>b.onclick=()=>{planEdit=b.dataset.planedit;planSel=null;render()});
  document.querySelectorAll('.plan').forEach(plan=>{const room=S.rooms.find(r=>r.id===plan.dataset.room);if(!room)return;const ed=planEdit===room.id;
    const objOf=k=>k[0]==='c'?(cabOf(k.slice(2))||{}).pos:room.fix.find(f=>f.id===k.slice(2));
    const wrap=plan.parentNode;
    plan.querySelectorAll('.pblk').forEach(el=>{const k=el.dataset.k;
      if(!ed){if(k[0]==='c'){const goCab=()=>{const t=document.getElementById('cabw-'+k.slice(2));if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1400)}};el.onclick=goCab;el.onkeydown=e=>{if(e.key==='Enter')goCab()}}return}
      el.onpointerdown=e=>{const p=objOf(k);if(!p)return;e.preventDefault();planSel=k;plan.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
        const r=plan.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y;let moved=false;try{el.setPointerCapture(e.pointerId)}catch(_){}
        el.onpointermove=ev=>{const nx=Math.min(PW-p.w,Math.max(0,Math.round((ox+(ev.clientX-sx)/r.width*PW)*2)/2)),ny=Math.min(PH-p.h,Math.max(0,Math.round((oy+(ev.clientY-sy)/r.height*PH)*2)/2));
          if(nx!==p.x||ny!==p.y){p.x=nx;p.y=ny;el.style.left=(nx/PW*100)+'%';el.style.top=(ny/PH*100)+'%';moved=true}};
        el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null;if(moved){cfgBump();save()}}}});
    if(!ed)return;
    wrap.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{const a=b.dataset.pa;if(a==='done'){planEdit=null;planSel=null;cfgBump();save();render();return}
      const p=planSel&&objOf(planSel);if(!p){toast('먼저 배치도에서 옮길 것을 누르세요');return}
      if(a==='rot'){const w=p.w;p.w=Math.min(PW,p.h);p.h=Math.min(PH,w)}
      if(a==='wider'){if(p.w>=p.h)p.w=Math.min(PW,p.w+1);else p.h=Math.min(PH,p.h+1)}
      if(a==='narrower'){if(p.w>=p.h)p.w=Math.max(1,p.w-1);else p.h=Math.max(1,p.h-1)}
      if(a==='del'){if(planSel[0]==='c'){toast('시약장은 여기서 지울 수 없습니다. 문·창문 같은 표시만 지웁니다');return}room.fix=room.fix.filter(f=>f.id!==planSel.slice(2));planSel=null}
      if(p){p.x=Math.min(p.x,PW-p.w);p.y=Math.min(p.y,PH-p.h)}cfgBump();save();render()});
    wrap.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const t=b.dataset.fix;const wide=['board','window','bench'].includes(t);const f={id:uid(),t,x:5,y:PH-1,w:wide?3:1,h:1};room.fix.push(f);planSel='f:'+f.id;cfgBump();save();render()})})}

const GROUPS={A1:'무기산',A2:'산화성 산',A3:'유기산',B:'염기',F:'인화성',O:'산화제',M:'반응성 금속',T:'독성',G:'일반'};
const baseGroup=g=>(g||'G').split('(')[0];
const gcls=g=>'g'+baseGroup(g);
const CONFLICT=[['A1','B'],['A2','B'],['A3','B'],['A2','A3'],['A2','F'],['O','F'],['O','A3'],['O','M'],['M','A1'],['M','A2'],['M','A3']];
function conflicts(g1,g2){const a=baseGroup(g1),b=baseGroup(g2);return CONFLICT.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));}

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function cho(s){let o='';for(const ch of s){const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)o+=CHO[Math.floor((c-0xAC00)/588)];else if(CHO.includes(ch))o+=ch}return o}
const norm=s=>(s||'').toLowerCase().replace(/[\s()·\-_,.#]/g,'').replace(/[₀-₉]/g,d=>String(d.charCodeAt(0)-0x2080));
const isCho=q=>q.length>0&&[...q].every(ch=>CHO.includes(ch));
function matchText(q,fields){const nq=norm(q);if(!nq)return false;const qc=q.replace(/\s/g,'');
  if(isCho(qc))return fields.some(f=>cho((f||'').replace(/\s/g,'')).startsWith(qc));
  return fields.some(f=>norm(f).includes(nq))}

function resRow(b){return '<div class="res" role="button" tabindex="0" data-b="'+b.id+'">'+tile(b)+'<div class="grow"><div class="nm">'+esc(b.name)+' <span class="muted">'+b.size+' '+b.unit+(b.made?' · 자체 제조':'')+(b.memo?' · '+esc(b.memo):'')+'</span></div><div class="path">'+pathOf(b)+(b.out?' · <span style="color:var(--warn)">사용 중</span>':'')+'</div>'+(b.tags.length?'<div>'+b.tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div>':'')+'</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'+meter(b.remain)+'<span class="muted" style="font-size:12px">'+remainLabel(b.remain)+'</span>'+(canEdit()&&b.remain>0?'<button class="btn sm use" data-use="'+b.id+'">'+E('use')+' 썼어요</button>':'')+'</div></div>'}
function bindRes(root){(root||document).querySelectorAll('.res[data-b]').forEach(el=>{el.onclick=()=>bottleModal(el.dataset.b);el.onkeydown=e=>{if(e.key==='Enter')bottleModal(el.dataset.b)}});
  (root||document).querySelectorAll('[data-use]').forEach(bt=>bt.onclick=e=>{e.stopPropagation();const b=useOnce(bt.dataset.use);if(!b)return;const row=bt.closest('.res');const tmp=document.createElement('div');tmp.innerHTML=resRow(b);row.replaceWith(tmp.firstChild);bindRes(root)})}
const STEP=[1,.75,.5,.25,0];
function remainLabel(v){return {1:'가득',0.75:'3/4',0.5:'1/2',0.25:'1/4',0:'빈 병'}[v]||Math.round(v*100)+'%'}
function useOnce(id){const b=S.bottles.find(x=>x.id===id);if(!b)return null;const nr=STEP.find(s=>s<b.remain-0.001);if(nr===undefined){toast('이미 빈 병입니다');return null}
  pushH(b,{t:today(),who:S.me.name,what:'썼어요 '+remainLabel(b.remain)+' → '+remainLabel(nr)});b.remain=nr;
  if(nr<=0.25){addBuy(b.name,'잔량 '+remainLabel(nr));toast(b.name+' '+remainLabel(nr)+' — 구매 목록에 넣었습니다')}else toast(b.name+' 잔량 '+remainLabel(nr));save();return b}
function doSearch(){
  const box=document.getElementById('results');const q=lastQ.trim();if(!q){box.innerHTML='';return}
  const hits=S.bottles.filter(b=>matchText(q,bottleFields(b)));
  const slotHits=[];S.cabinets.forEach(cab=>Object.keys(cab.slots).forEach(k=>{const lab=slotLabel(cab,k);if(norm(lab).includes(norm(q)))slotHits.push({cab,k,lab})}));
  let h='';
  if(hits.length){const f=hits[0];h+='<div class="note info">📍 '+esc(f.name)+' → '+pathOf(f)+' <button class="btn sm" id="showOnCab">시약장에서 보기</button></div>'+hits.map(resRow).join('')}
  if(slotHits.length)h+='<h3>칸</h3>'+slotHits.map(s=>'<div class="res" role="button" tabindex="0" data-slot="'+s.cab.id+'|'+s.k+'"><span class="tile gG"><span class="tf">'+esc(s.cab.code)+'</span><span class="tn">칸</span></span><div class="grow"><div class="nm">'+esc(s.lab)+'</div><div class="path">'+esc(s.cab.name)+' · '+bottlesIn(s.cab.id,s.k).length+'병</div></div></div>').join('');
  if(!hits.length&&!slotHits.length){const m=M.find(x=>matchText(q,[x.name,x.eng,x.formula,x.cas,...x.alias]));
    box.innerHTML='<div class="note warn">우리 학교에 없는 시약입니다'+(m?': '+esc(m.name)+' ('+esc(m.cas)+')':'')+'</div>'+(m?'<div class="row"><button class="btn pri" id="toBuy">구매 목록에 추가</button><button class="btn" id="toAdd">지금 등록</button></div>':'');
    if(m){document.getElementById('toBuy').onclick=()=>{addBuy(m.name,'검색에서 추가');toast('구매 목록에 추가했습니다')};document.getElementById('toAdd').onclick=()=>{draft={master:m.name};go('add')}}return}
  box.innerHTML=h;bindRes(box);
  const sb=document.getElementById('showOnCab');if(sb)sb.onclick=()=>{const f=hits[0];go('cabinet',{hl:{cab:f.cabId,k:f.slot}})};
  box.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>{const [c,k]=el.dataset.slot.split('|');go('cabinet',{hl:{cab:c,k}})});
}

function cabHTML(cab){const room=roomOf(cab.roomId);let cells='';
  for(let r=1;r<=cab.rows;r++)for(let c=1;c<=cab.cols;c++){const k=slotKey(r,c);const bs=bottlesIn(cab.id,k);const s=cab.slots[k];const on=hl&&hl.cab===cab.id&&hl.k===k;
    const names=[...new Set(bs.map(b=>b.name))];const n0=names[0];const cnt0=bs.filter(b=>b.name===n0).length;
    cells+='<button class="slot'+(on?' hl':'')+'" data-cab="'+cab.id+'" data-k="'+k+'" aria-label="'+esc(slotLabel(cab,k))+', '+bs.length+'병"><span class="sn">'+r+'단'+(cab.cols>1?' '+colName(cab,c):'')+(s.name?' · '+esc(s.name):'')+'</span>'+
    '<span class="cnt">'+(bs.length?esc(n0)+(cnt0>1?' ×'+cnt0:'')+(names.length>1?' 외 '+(names.length-1)+'종':''):'<span class="muted">빈 칸</span>')+'</span>'+(bs.some(b=>b.out)?'<span class="out">사용 중</span>':'')+'<span class="grp">'+(s.allowed||[]).join('·')+'</span></button>'}
  const mg=cabMainGroup(cab);
  return '<div class="cab" style="--ccol:var(--c'+mg[0]+')"><div class="hd"><span class="code">'+esc(cab.code)+'</span>'+esc(cab.name)+'<span class="room">'+esc(room?room.name:'')+'</span></div><div class="grid" style="grid-template-columns:repeat('+cab.cols+',1fr)">'+cells+'</div></div>'}
function vCabinet(){
  V().innerHTML='<section class="panel"><div class="row"><h2 class="grow" style="margin:0">시약장 배치</h2>'+(isAdmin()?'<button class="btn" id="addCab">시약장 추가</button>':'')+'</div>'+
  '<p class="muted">위 배치도는 과학실에 시약장이 놓인 자리입니다. 아래 그림에서 칸을 누르면 그 칸의 시약이 나옵니다. 칸 아래 작은 글씨는 넣을 수 있는 저장군입니다.</p>'+
  S.rooms.map(room=>{const cs=S.cabinets.filter(c=>c.roomId===room.id);return cs.length?'<h3>'+esc(room.name)+'</h3>'+planHTML(room)+'<div class="cabs">'+cs.map(c=>'<div id="cabw-'+c.id+'">'+cabHTML(c)+'</div>').join('')+'</div>':''}).join('')+'</section>'+

function slotModal(cabId,k){const cab=cabOf(cabId);const s=cab.slots[k];const bs=bottlesIn(cabId,k);
  modal('<h2>'+esc(slotLabel(cab,k))+'</h2><div class="path">'+esc(roomOf(cab.roomId)?.name||'')+' › '+esc(cab.name)+'</div>'+(bs.length?bs.map(resRow).join(''):'<div class="note info">빈 칸입니다. 아래 버튼으로 바로 등록하세요.</div>')+
  (isAdmin()?'<h3>칸 설정</h3><label for="sName">칸 이름</label><input id="sName" value="'+esc(s.name)+'" placeholder="예: 학생 실험용, 염산 칸"><label>넣을 수 있는 저장군</label><div class="row">'+Object.keys(GROUPS).map(g=>'<label style="margin:0;display:flex;gap:4px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto;min-height:0" value="'+g+'" '+((s.allowed||[]).includes(g)?'checked':'')+'>'+g+'</label>').join('')+'</div>':'')+

      S.bottles.filter(b=>b.cabId===cab.id&&!ns[b.slot]).forEach(b=>{b.slot='1-1';pushH(b,{t:today(),who:S.me.name,what:'칸 축소로 1단 첫 칸으로 이동'})});cab.rows=rows;cab.cols=cols;cab.slots=ns;logAct('시약장 편집: '+code);cfgBump()}

/* ===== CSV 가져오기 ===== */
function importCSV(text){const lines=text.trim().split(/\r?\n/).filter(Boolean);if(lines.length&&/시약/.test(lines[0]))lines.shift();let ok=0,bad=0;
  lines.forEach(l=>{const [n,sz,u,code,r,c]=l.split(',').map(x=>(x||'').trim());if(!n)return;const m=M.find(x=>[x.name,...x.alias,x.eng].some(f=>norm(f)===norm(n)))||M.find(x=>matchText(n,[x.name,...x.alias,x.eng]))||null;const cab=S.cabinets.find(x=>x.code===(code||'').toUpperCase());const key=slotKey(+r||1,+c||1);
    if(!cab||!cab.slots[key]){bad++;return}S.bottles.push({id:uid(),name:m?m.name:n,formula:m?m.formula:'',cas:m?m.cas:'',group:m?m.group:'G',size:+sz||0,unit:u||'g',remain:1,cabId:cab.id,slot:key,maker:'',grade:'',opened:'',expiry:'',memo:'',made:false,tags:[],photo:'',out:null,hist:[{t:today(),who:S.me.name,what:'엑셀 가져오기'}],mt:Date.now()});ok++});
  logAct('엑셀 가져오기 '+ok+'병');return {ok,bad}}

    const pos=it=>{const b=S.bottles.find(x=>x.id===it.id);if(!b)return 'zz';const c=cabOf(b.cabId);return (c?c.code:'z')+'-'+b.slot};items.sort((a,b)=>pos(a).localeCompare(pos(b)));
    S.basket={title:e.topic+' · '+e.title,start:today(),items};logAct('수업 준비 시작: '+e.topic);save();go('basket')};

const ITER=150000;

async function pbkdf(pw,salt,iter){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits','deriveKey']);return k}

async function setPassword(pw){const salt=crypto.getRandomValues(new Uint8Array(16));S.lock={salt:b64(salt),iter:ITER,hash:await pwHash(pw,salt,ITER),set:today(),by:S.me.name};cfgBump();save()}
async function checkPassword(pw,lock){lock=lock||S.lock;if(!lock)return true;return (await pwHash(pw,ub64(lock.salt),lock.iter))===lock.hash}

function mergeIn(d){const L=S;let nb=0,cb=0;const tomb=new Set([...(L.tomb||[]),...(d.tomb||[])].map(x=>x.id));
  const byId=new Map(L.bottles.map(b=>[b.id,b]));
  d.bottles.forEach(b=>{if(tomb.has(b.id))return;const o=byId.get(b.id);if(!o){byId.set(b.id,b);nb++}else if((b.mt||0)>(o.mt||0)){byId.set(b.id,b);cb++}});
  L.bottles=[...byId.values()].filter(b=>!tomb.has(b.id));
  const tm=new Map();[...(L.tomb||[]),...(d.tomb||[])].forEach(x=>tm.set(x.id,x));L.tomb=[...tm.values()];
  const wm=new Map();[...L.waste,...(d.waste||[])].forEach(w=>wm.set(w.id,w));L.waste=[...wm.values()];
  const lk=new Set(L.log.map(x=>x.t+x.who+x.what));(d.log||[]).forEach(x=>{if(!lk.has(x.t+x.who+x.what))L.log.push(x)});
  (d.buy||[]).forEach(x=>{if(!L.buy.some(y=>y.name===x.name))L.buy.push(x)});
  (d.members||[]).forEach(dm=>{const lm=L.members.find(x=>x.id===dm.id);if(lm&&lm.code&&!dm.code){delete lm.code;delete lm.plain}});
  let cfg=false;if((d.cfgMt||0)>(L.cfgMt||0)){['school','rooms','cabinets','members','lock','cfgMt'].forEach(k=>L[k]=d[k]);cfg=true}
  const me=L.members.find(m=>m.id===L.me.id);if(me){L.me.role=me.role;L.me.name=me.name}

async function makePackage(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await aesKey(pw,salt,ITER);
  const data=Object.assign({},S,{me:null,audit:null,basket:null,demo:false,members:S.members.map(m=>{const c=Object.assign({},m);delete c.plain;return c})});
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));
  return 'SJJ1.'+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,school:S.school,made:today(),by:S.me.name,salt:b64(salt),iv:b64(iv),iter:ITER,ct:b64big(ct)}))))}
async function openPackage(text,pw){const t=text.trim();if(!t.startsWith('SJJ1.'))throw new Error('form');const p=JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))));

  bindBack();document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.th);render();toast(TH.name+' 디자인')})}

/* ===== 커피 한잔 사주기 =====
   iOS 앱: App Store 인앱결제(소모성) — 네이티브 쪽 window.SJJNative.tip(id), prices(ids)
   웹앱: 아래 SUPPORT.web 에 단계별 결제 링크를 넣으세요(토스페이먼츠 결제 링크 등). 비어 있으면 '준비 중' 표시 */
const SUPPORT={
  web:{'tip.coffee1':'','tip.coffee2':'','tip.meal':''},
  tips:[{id:'tip.coffee1',emo:'☕',name:'커피 한잔',desc:'오늘도 수고했어요',price:'₩3,300'},
        {id:'tip.coffee2',emo:'☕☕',name:'커피 두잔',desc:'옆자리 선생님 것까지',price:'₩6,600'},
        {id:'tip.meal',emo:'🍚',name:'든든한 한끼',desc:'국밥 한 그릇의 응원',price:'₩11,000'}]};
function vCoffee(){const nat=window.SJJNative&&typeof window.SJJNative.tip==='function';const anyWeb=Object.values(SUPPORT.web).some(Boolean);
  V().innerHTML='<h1 class="pt">선생님을 응원합니다</h1>'+
  '<section class="panel" style="text-align:center"><div style="font-size:56px" aria-hidden="true">'+E('cheer')+'</div><h3 style="margin:8px 0">오늘도 과학실을 지키는 선생님께</h3><p>수업 준비에 실험 준비, 시약 정리와 안전 점검까지.<br>눈에 잘 띄지 않는 그 수고 덕분에 아이들은 오늘도 안전하게 실험합니다.<br><b>학교의 모든 과학 선생님을 응원합니다.</b></p></section>'+
  '<section class="panel"><h3 style="margin-top:0">왜 만들었나요</h3><p>시약장 앞에서 "그 시약이 어디 있더라", "얼마나 남았지" 하며 보내는 시간을 줄여 드리고 싶었습니다. 시약 관리가 쉬워지면 선생님은 수업과 학생에게 더 마음을 쓸 수 있으니까요.</p><p>세이프랩노트는 과학 선생님께 작은 도움이 되고자 만들었습니다. 광고 없이, 모든 기능이 무료입니다.</p></section>'+
  '<section class="panel" style="text-align:center"><div style="font-size:40px" aria-hidden="true">'+E('coffee')+'</div><h3 style="margin:6px 0">개발자에게 커피 한잔</h3><p>도움이 되었다면 커피 한잔으로 응원해 주세요. 더 좋은 앱을 만드는 힘이 됩니다.</p><p class="muted">응원해도 바뀌는 기능은 없습니다. 모든 기능은 계속 무료입니다.</p></section>'+
  '<section class="panel">'+SUPPORT.tips.map(t=>{const url=SUPPORT.web[t.id];const inner='<span style="font-size:26px;width:56px;text-align:left" aria-hidden="true">'+t.emo+'</span><span class="grow" style="text-align:left"><b>'+t.name+'</b><br><span class="muted">'+t.desc+'</span></span><b data-price="'+t.id+'">'+(nat?'…':t.price)+'</b>';
    const st='width:100%;margin:6px 0;display:flex;align-items:center;gap:8px;min-height:72px;text-decoration:none';
    if(nat)return '<button class="btn" data-tip="'+t.id+'" style="'+st+'">'+inner+'</button>';
    return url?'<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener" style="'+st+'">'+inner+'</a>':'<div class="btn" aria-disabled="true" style="'+st+';opacity:.55;cursor:default">'+inner+'</div>'}).join('')+
  (!nat&&!anyWeb?'<div class="note info">웹 결제를 준비하고 있습니다. 아이폰·아이패드 앱에서는 바로 응원할 수 있습니다.</div>':'')+
  '<p class="muted" style="margin-top:12px">문의·제안은 <a href="#" id="toFb">의견 보내기</a>로 남겨 주세요.</p></section>';
  document.getElementById('toFb').onclick=e=>{e.preventDefault();go('feedback')};
  if(nat){if(window.SJJNative.prices)window.SJJNative.prices(SUPPORT.tips.map(t=>t.id)).then(p=>{Object.entries(p||{}).forEach(([k,v])=>{const el=document.querySelector('[data-price="'+k+'"]');if(el)el.textContent=v})}).catch(()=>{});
    document.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>window.SJJNative.tip(b.dataset.tip).then(ok=>{if(ok){logAct('개발자 응원: '+SUPPORT.tips.find(t=>t.id===b.dataset.tip).name);save();modal('<div style="text-align:center;font-size:56px">'+E('coffee')+'</div><h2 style="text-align:center">고맙습니다!</h2><p style="text-align:center">보내 주신 응원으로 더 좋은 세이프랩노트를 만들겠습니다.</p><button class="btn pri bigbtn" id="ty">닫기</button>');document.getElementById('ty').onclick=closeModal}}).catch(()=>toast('결제가 취소되었습니다')))}}

/* ===== 의견 보내기 (설문) =====
   FEEDBACK.endpoint 에 Google Apps Script 웹 앱 주소를 넣으면 응답이 구글 시트에 쌓입니다.
   비어 있거나 전송이 막히면 내용을 복사해 메일로 보내도록 안내합니다. */
const FEEDBACK={endpoint:''};
const OUTBOX='sijakjang-fb-outbox';
function outbox(){try{return JSON.parse(lsGet(OUTBOX)||'[]')}catch(e){return []}}
async function postFb(p){if(!FEEDBACK.endpoint||!navigator.onLine)return false;try{await fetch(FEEDBACK.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return true}catch(e){return false}}
async function flushOutbox(){const q=outbox();if(!q.length)return 0;const left=[];let n=0;for(const p of q){if(await postFb(p))n++;else left.push(p)}lsSet(OUTBOX,JSON.stringify(left));return n}
const FB_TYPES=[['question','❓','질문'],['bug','🐞','문제점·오류'],['idea','💡','개선 제안'],['praise','👍','좋았던 점']];
const FB_SCREENS=['찾기','시약장','등록','썼어요·잔량','여러 병 등록','수업 준비','실험별 시약','실험실 안전','사용 방법','구매·폐액·실사','학교·비밀번호·데이터 받기','디자인','응원·커피 한잔','처음 설정','기타'];
function vFeedback(){let type='bug',rating=0;
  const sent=(()=>{try{return JSON.parse(lsGet('sijakjang-fb')||'[]')}catch(e){return []}})();
  const draw=()=>{V().innerHTML=backBar()+'<section class="panel"><h2>'+E('feedback')+' 의견 보내기</h2><p class="muted">질문, 문제점, 개선할 점을 알려 주세요. 학교 시약 데이터는 보내지 않습니다.</p>'+
    '<form id="fbForm"><label>무엇을 보내나요?</label><div class="seg" role="group" aria-label="종류">'+FB_TYPES.map(([k,e,t])=>'<button type="button" data-ft="'+k+'" aria-pressed="'+(type===k)+'">'+e+' '+t+'</button>').join('')+'</div>'+
    '<label for="fbScreen">어느 화면인가요?</label><select id="fbScreen">'+FB_SCREENS.map(x=>'<option>'+x+'</option>').join('')+'</select>'+
    '<label>앱이 얼마나 쓸 만한가요?</label><div class="row" role="group" aria-label="만족도">'+[1,2,3,4,5].map(n=>'<button type="button" class="btn sm" data-rt="'+n+'" aria-pressed="'+(rating===n)+'" style="'+(n<=rating?'background:var(--pri);color:var(--pri-ink)':'')+'">'+'★'.repeat(1)+' '+n+'</button>').join('')+'</div>'+
    '<label for="fbText">'+(type==='bug'?'무엇을 했을 때 어떤 문제가 생겼나요?':type==='question'?'궁금한 점을 적어 주세요':type==='idea'?'어떻게 바뀌면 좋을까요?':'좋았던 점을 적어 주세요')+'</label><textarea id="fbText" required minlength="5" maxlength="2000" placeholder="'+(type==='bug'?'예: 라벨 사진을 찍었는데 시약 이름이 채워지지 않아요':'자유롭게 적어 주세요')+'"></textarea>'+
    '<label for="fbMail">답을 받을 이메일 (선택)</label><input id="fbMail" type="email" autocomplete="email" placeholder="답장이 필요할 때만">'+
    '<label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input id="fbDev" type="checkbox" checked style="width:auto;min-height:0"> 문제 해결을 위해 앱 버전·기기 종류·화면 크기를 함께 보냅니다</label>'+
    '<input id="fbHp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">'+
    '<p class="muted" style="font-size:12px">이메일을 적으면 답장 목적으로만 쓰고 답장 후 지웁니다.'+(outbox().length?' · 보내지 못한 의견 '+outbox().length+'건은 연결되면 자동으로 보냅니다.':'')+'</p><div id="fbMsg"></div><button class="btn pri bigbtn" style="margin-top:6px">보내기</button></form><textarea id="fbOut" style="display:none;margin-top:8px" readonly aria-label="보낼 내용"></textarea></section>'+
    (sent.length?'<section class="panel"><h2>내가 보낸 의견</h2>'+sent.slice(-5).reverse().map(x=>'<div class="alert"><span class="k info">'+esc(x.t)+'</span><span class="grow">'+esc(x.label)+' · '+esc(x.text.slice(0,40))+'</span></div>').join('')+'</section>':'');
    bindBack();const $=id=>document.getElementById(id);
    document.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{const keep=$('fbText').value;type=b.dataset.ft;draw();$('fbText').value=keep});
    document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{const keep=$('fbText').value,sc=$('fbScreen').value;rating=+b.dataset.rt;draw();$('fbText').value=keep;$('fbScreen').value=sc});
    $('fbForm').onsubmit=async e=>{e.preventDefault();if($('fbHp').value)return;const text=$('fbText').value.trim();if(text.length<5){$('fbMsg').innerHTML='<div class="note bad">5자 이상 적어 주세요.</div>';return}
      const label=FB_TYPES.find(x=>x[0]===type)[2];
      const p={type:label,screen:$('fbScreen').value,rating:rating||'',text,email:$('fbMail').value.trim(),version:APP_VERSION,platform:window.SJJ_PLATFORM||'web',
        device:$('fbDev').checked?(navigator.userAgent.slice(0,160)+' | '+screen.width+'x'+screen.height):'',design:$('fbDev').checked?TH.name:'',role:S.me.role};
      const done=()=>{sent.push({t:today(),label,text});lsSet('sijakjang-fb',JSON.stringify(sent.slice(-20)))};
      const ok=await postFb(p);
      if(ok){done();modal('<div style="text-align:center;font-size:48px">'+E('feedback')+'</div><h2 style="text-align:center">보냈습니다. 고맙습니다!</h2><p style="text-align:center">'+(p.email?'답장은 적어 주신 이메일로 보내 드립니다.':'보내 주신 의견은 다음 업데이트에 반영하겠습니다.')+'</p><button class="btn pri bigbtn" id="fbOk">닫기</button>');document.getElementById('fbOk').onclick=()=>{closeModal();go('more')};return}
      const q=outbox();q.push(Object.assign({queued:today()},p));lsSet(OUTBOX,JSON.stringify(q.slice(-20)));done();
      modal('<div style="text-align:center;font-size:48px">📮</div><h2 style="text-align:center">보관해 두었습니다</h2><p style="text-align:center">지금은 보낼 수 없어 이 기기에 담아 두었습니다. 인터넷이 연결된 상태로 앱을 다시 열면 자동으로 보냅니다.</p><button class="btn pri bigbtn" id="fbOk">확인</button>');document.getElementById('fbOk').onclick=()=>{closeModal();go('more')}}};
  draw()}

document.getElementById('schoolName').onclick=()=>schoolPicker(false);
const br=document.getElementById('brand');br.style.cursor='pointer';br.title='디자인 고르기';br.onclick=()=>themeModal();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.SJJNative)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
i18nStart();render();if(FIRST)welcome();else if(needUnlock())showLock();
setTimeout(()=>flushOutbox().then(n=>{if(n)toast('보관해 둔 의견 '+n+'건을 보냈습니다')}),2500);window.addEventListener('online',()=>flushOutbox());
</script>
</body>
